<!doctype html><html><head><meta charset="utf-8"><title>Cast Quest State Transfer</title><script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#69cdf5}canvas{display:block}</style></head><body><canvas id="g"></canvas><script>
const canvas=document.getElementById('g'),ctx=canvas.getContext('2d');const H=720,WORLD=5000,GROUND=640;let dpr=1,VW=1280,scaleView=1,move=0,paused=false,camera=0,lastInput='ready';let player,enemies;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){player={x:100,y:GROUND-58,vy:0,scale:1,hp:100,maxHp:100,level:1,xp:0,potions:3,onGround:true,attack:0,direction:'right'};enemies=Array.from({length:10},(_,i)=>({x:600+i*420,y:GROUND-40,w:42,h:40,hp:2,dir:i%2?1:-1}));move=0;paused=false;camera=0;}
function resize(){dpr=Math.max(1,Math.min(3,devicePixelRatio||1));const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);VW=H*(w/h);scaleView=h/H;}addEventListener('resize',resize);resize();reset();
function exportStateObject(){return{version:1,worldWidth:WORLD,player:{x:player.x,y:player.y,vy:player.vy,scale:player.scale,hp:player.hp,maxHp:player.maxHp,level:player.level,xp:player.xp,potions:player.potions,onGround:player.onGround,attack:player.attack,direction:player.direction},enemies:enemies.map(e=>({...e})),camera,paused,move};}
function importState(state){if(!state||!state.player)return;const p=state.player;player.x=clamp(Number(p.x)||0,0,WORLD);player.y=Number.isFinite(Number(p.y))?Number(p.y):GROUND-58;player.vy=Number(p.vy)||0;player.scale=clamp(Number(p.scale)||1,.5,10);player.hp=Number(p.hp)||0;player.maxHp=Number(p.maxHp)||100;player.level=Number(p.level)||1;player.xp=Number(p.xp)||0;player.potions=Number(p.potions)||0;player.onGround=!!p.onGround;player.attack=Number(p.attack)||0;player.direction=p.direction||'right';if(Array.isArray(state.enemies))enemies=state.enemies.map(e=>({x:Number(e.x)||0,y:Number(e.y)||GROUND-40,w:Number(e.w)||42,h:Number(e.h)||40,hp:Number(e.hp)||0,dir:Number(e.dir)||1}));camera=clamp(Number(state.camera)||0,0,WORLD);paused=!!state.paused;move=0;lastInput='state loaded';}
function input(m){if(m.type==='stateTransfer'||m.action==='loadState'){importState(m.state);return;}lastInput=m.action+(m.direction?' '+m.direction:'')+(m.value!==undefined?' '+Number(m.value).toFixed(2):'');if(m.action==='move'){move=clamp(Number(m.value)||0,-1,1);return;}if(m.action==='scale'){let old=58*player.scale;player.scale=clamp(Number(m.value)||1,.5,10);player.y+=old-58*player.scale;return;}if(m.action==='pause'){paused=!paused;move=0;return;}if(paused)return;if(m.action==='jump'&&player.onGround){player.vy=-760;player.onGround=false;}else if(m.action==='potion'&&player.potions>0){player.potions--;player.hp=Math.min(player.maxHp,player.hp+35);}else if(m.action==='attack'){player.attack=.25;player.direction=m.direction||'right';}}
function update(dt){if(paused)return;const pw=42*player.scale,ph=58*player.scale;player.x=clamp(player.x+move*300*dt,0,WORLD-pw);player.vy+=1850*dt;player.y+=player.vy*dt;if(player.y+ph>=GROUND){player.y=GROUND-ph;player.vy=0;player.onGround=true;}if(player.attack>0)player.attack-=dt;for(const e of enemies){if(e.hp<=0)continue;e.x+=e.dir*38*dt;if(player.attack>0&&Math.abs(e.x-player.x)<Math.max(60,60*player.scale)&&Math.abs(e.y-player.y)<Math.max(70,70*player.scale)){e.hp--;player.attack=0;if(e.hp<=0){player.xp+=12;if(player.xp>=player.level*30){player.level++;player.maxHp+=15;player.hp=player.maxHp;}}}}const target=clamp(player.x-VW*.35,0,Math.max(0,WORLD-VW));camera+=(target-camera)*Math.min(1,dt*7);}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#69cdf5';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(dpr*scaleView,0,0,dpr*scaleView,0,0);ctx.fillStyle='#dff6ff';for(let i=0;i<10;i++){let x=((i*260-camera*.2)%2200+2200)%2200-100;ctx.beginPath();ctx.arc(x,90+(i%3)*42,45,0,7);ctx.fill();}ctx.save();ctx.translate(-camera,0);ctx.fillStyle='#744b2b';ctx.fillRect(0,GROUND,WORLD,300);ctx.fillStyle='#36a34a';ctx.fillRect(0,GROUND,WORLD,14);for(const e of enemies)if(e.hp>0){ctx.fillStyle='#e11d48';ctx.fillRect(e.x,e.y,e.w,e.h);}const pw=42*player.scale,ph=58*player.scale;ctx.fillStyle='#f59e0b';ctx.fillRect(player.x,player.y,pw,ph);ctx.fillStyle='#2563eb';ctx.fillRect(player.x+4*player.scale,player.y+35*player.scale,34*player.scale,20*player.scale);if(player.attack>0){ctx.fillStyle='#fef08a';let r=50*player.scale;if(player.direction==='left')ctx.fillRect(player.x-r,player.y+10*player.scale,r,18*player.scale);else if(player.direction==='up')ctx.fillRect(player.x+10*player.scale,player.y-r,18*player.scale,r);else if(player.direction==='down')ctx.fillRect(player.x+10*player.scale,player.y+ph,18*player.scale,r);else ctx.fillRect(player.x+pw,player.y+10*player.scale,r,18*player.scale);}ctx.restore();ctx.fillStyle='rgba(15,23,42,.72)';ctx.fillRect(12,12,Math.min(620,VW-24),90);ctx.fillStyle='white';ctx.font='bold 22px sans-serif';ctx.fillText('CAST QUEST',24,40);ctx.font='16px sans-serif';ctx.fillText(`HP ${player.hp}/${player.maxHp} LV ${player.level} XP ${player.xp} SIZE ${player.scale.toFixed(2)}x`,24,66);ctx.fillText('LAST: '+lastInput,24,90);if(paused){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,VW,H);ctx.fillStyle='white';ctx.font='bold 54px sans-serif';ctx.textAlign='center';ctx.fillText('PAUSE',VW/2,H/2);ctx.textAlign='left';}}
let prev=performance.now();function loop(now){const dt=Math.min(.033,(now-prev)/1000);prev=now;update(dt);draw();requestAnimationFrame(loop);}requestAnimationFrame(loop);
const NS='urn:x-cast:com.example.castquest';const castContext=cast.framework.CastReceiverContext.getInstance();castContext.addCustomMessageListener(NS,event=>{try{const m=typeof event.data==='string'?JSON.parse(event.data):event.data;input(m);}catch(e){lastInput='ERR '+e.message;console.error(e);}});castContext.start({disableIdleTimeout:true});
</script></body></html>
