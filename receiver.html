<!doctype html><html><head><meta charset="utf-8"><title>Cast Quest Gesture Fixed</title><script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#071827}canvas{display:block}</style></head><body><canvas id="game"></canvas><script>
const NS='urn:x-cast:com.example.castquest',canvas=document.getElementById('game'),g=canvas.getContext('2d');
let moveValue=0,paused=false,won=false,gameOver=false,camera=0,lastInput='receiver ready';const worldWidth=6200,groundY=640;
let player={x:140,y:582,vx:0,vy:0,baseW:42,baseH:58,scale:1,hp:100,maxHp:100,level:1,xp:0,potions:3,onGround:true,attackTime:0,attackDirection:'right',invincibleTime:0,facing:1};
const platforms=[{x:0,y:groundY,w:worldWidth,h:300},{x:520,y:520,w:220,h:24},{x:900,y:450,w:180,h:24},{x:1350,y:540,w:260,h:24},{x:1900,y:470,w:180,h:24},{x:2450,y:400,w:240,h:24},{x:3100,y:530,w:260,h:24},{x:3800,y:450,w:220,h:24},{x:4550,y:520,w:300,h:24},{x:5300,y:420,w:230,h:24}];
let enemies=[],gems=[];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pw=()=>player.baseW*player.scale,ph=()=>player.baseH*player.scale,rect=()=>({x:player.x,y:player.y,w:pw(),h:ph()}),overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function init(){player={x:140,y:groundY-58,vx:0,vy:0,baseW:42,baseH:58,scale:1,hp:100,maxHp:100,level:1,xp:0,potions:3,onGround:true,attackTime:0,attackDirection:'right',invincibleTime:0,facing:1};moveValue=0;paused=won=gameOver=false;camera=0;enemies=[];gems=[];for(let i=0;i<12;i++)enemies.push({x:650+i*430,y:groundY-(i===11?72:42),w:i===11?72:44,h:i===11?72:42,hp:i===11?5:2,dir:i%2?1:-1,boss:i===11});for(let i=0;i<15;i++)gems.push({x:420+i*360,y:groundY-100-(i%3)*70,taken:false});}
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener('resize',resize);resize();init();
function scalePlayer(value){const old=ph();player.scale=clamp(Number(value)||1,.5,10);player.y+=old-ph();player.x=clamp(player.x,0,worldWidth-pw())}
function attackRect(){const p=rect(),reach=Math.max(50,45*player.scale),thick=Math.max(34,32*player.scale);if(player.attackDirection==='left')return{x:p.x-reach,y:p.y+p.h*.25,w:reach,h:thick};if(player.attackDirection==='up')return{x:p.x+p.w*.2,y:p.y-reach,w:thick,h:reach};if(player.attackDirection==='down')return{x:p.x+p.w*.2,y:p.y+p.h,w:thick,h:reach};return{x:p.x+p.w,y:p.y+p.h*.25,w:reach,h:thick}}
function input(m){lastInput=(m.action||'?')+(m.direction?' '+m.direction:'')+(m.value!==undefined?' '+Number(m.value).toFixed(2):'');console.log('INPUT',m);if(m.action==='move'){moveValue=clamp(Number(m.value)||0,-1,1);return}if(m.action==='scale'){scalePlayer(m.value);return}if(m.action==='pause'){paused=!paused;moveValue=0;return}if(m.action==='reset'){init();return}if(m.action==='sync')return;if(paused||gameOver||won)return;if(m.action==='jump'&&player.onGround){player.vy=-760;player.onGround=false}else if(m.action==='potion'&&player.potions>0&&player.hp<player.maxHp){player.potions--;player.hp=Math.min(player.maxHp,player.hp+45)}else if(m.action==='attack'&&player.attackTime<=0){player.attackDirection=m.direction||(player.facing>0?'right':'left');player.attackTime=.28}}
function update(dt){if(paused||won||gameOver)return;player.vx=moveValue*300;if(Math.abs(moveValue)>.05)player.facing=moveValue>0?1:-1;player.vy+=1850*dt;const oldBottom=player.y+ph();player.x=clamp(player.x+player.vx*dt,0,worldWidth-pw());player.y+=player.vy*dt;player.onGround=false;for(const p of platforms)if(player.x+pw()>p.x&&player.x<p.x+p.w&&oldBottom<=p.y+10&&player.y+ph()>=p.y&&player.vy>=0){player.y=p.y-ph();player.vy=0;player.onGround=true}if(player.y>1100)player.hp=0;if(player.attackTime>0)player.attackTime-=dt;if(player.invincibleTime>0)player.invincibleTime-=dt;const pr=rect(),hr=attackRect();for(const e of enemies){if(e.hp<=0)continue;e.x+=e.dir*(e.boss?65:42)*dt;if(e.x<100||e.x>worldWidth-100)e.dir*=-1;if(player.attackTime>0&&overlap(hr,e)){e.hp--;player.attackTime=0;if(e.hp<=0){player.xp+=e.boss?50:12;if(player.xp>=player.level*30){player.level++;player.maxHp+=15;player.hp=player.maxHp}}}if(overlap(pr,e)&&player.invincibleTime<=0){player.hp-=e.boss?25:14;player.invincibleTime=1;player.vy=-320}}for(const gem of gems)if(!gem.taken&&Math.abs(player.x+pw()/2-gem.x)<Math.max(42,pw()/2)&&Math.abs(player.y+ph()/2-gem.y)<Math.max(50,ph()/2)){gem.taken=true;player.xp+=5}if(player.hp<=0)gameOver=true;if(player.x>worldWidth-180)won=true;const vw=canvas.width/(canvas.height/720),target=clamp(player.x-vw*.35,0,Math.max(0,worldWidth-vw));camera+=(target-camera)*Math.min(1,dt*7)}
function draw(){let W=canvas.width,H=canvas.height,s=H/720;g.setTransform(s,0,0,s,0,0);W/=s;H/=s;g.fillStyle='#6fd3ff';g.fillRect(0,0,W,H);g.fillStyle='#dff6ff';for(let i=0;i<8;i++){let x=((i*310-camera*.18)%2400+2400)%2400-200;g.beginPath();g.arc(x,110+(i%3)*55,55,0,7);g.fill()}g.fillStyle='#75b85b';for(let i=0;i<20;i++){let x=i*380-camera*.45;g.beginPath();g.moveTo(x,groundY);g.lineTo(x+190,300+(i%3)*55);g.lineTo(x+380,groundY);g.fill()}g.save();g.translate(-camera,0);for(const p of platforms){g.fillStyle=p.y===groundY?'#654321':'#8b5a2b';g.fillRect(p.x,p.y,p.w,p.h);g.fillStyle='#38a34a';g.fillRect(p.x,p.y,p.w,12)}for(const gem of gems)if(!gem.taken){g.fillStyle='#7c3aed';g.beginPath();g.moveTo(gem.x,gem.y-14);g.lineTo(gem.x+13,gem.y);g.lineTo(gem.x,gem.y+14);g.lineTo(gem.x-13,gem.y);g.fill()}for(const e of enemies)if(e.hp>0){g.fillStyle=e.boss?'#991b1b':'#e11d48';g.fillRect(e.x,e.y,e.w,e.h);g.fillStyle='#fff';g.fillRect(e.x+8,e.y+10,8,8);g.fillRect(e.x+e.w-16,e.y+10,8,8)}if(player.invincibleTime<=0||Math.floor(player.invincibleTime*12)%2===0){g.fillStyle='#f59e0b';g.fillRect(player.x,player.y,pw(),ph());g.fillStyle='#0f172a';g.fillRect(player.x+pw()*.2,player.y+ph()*.18,pw()*.18,ph()*.14);g.fillStyle='#2563eb';g.fillRect(player.x+pw()*.1,player.y+ph()*.6,pw()*.8,ph()*.34)}if(player.attackTime>0){const h=attackRect();g.fillStyle='rgba(254,240,138,.85)';g.fillRect(h.x,h.y,h.w,h.h)}g.fillStyle='#facc15';g.fillRect(worldWidth-100,groundY-150,18,150);g.fillStyle='#ef4444';g.fillRect(worldWidth-82,groundY-150,95,55);g.restore();g.fillStyle='rgba(15,23,42,.88)';g.fillRect(18,18,650,112);g.fillStyle='#fff';g.font='bold 24px sans-serif';g.fillText('CAST QUEST GESTURE FIXED',34,48);g.font='18px sans-serif';g.fillText(`LV ${player.level} XP ${player.xp} POTION ${player.potions} SIZE ${player.scale.toFixed(2)}x`,34,78);g.fillText(`LAST INPUT: ${lastInput}`,34,105);g.fillStyle='#3f1d1d';g.fillRect(420,88,210,18);g.fillStyle='#22c55e';g.fillRect(420,88,210*Math.max(0,player.hp/player.maxHp),18);if(paused||gameOver||won){g.fillStyle='rgba(0,0,0,.72)';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.font='bold 62px sans-serif';g.textAlign='center';g.fillText(paused?'PAUSE':won?'STAGE CLEAR!':'GAME OVER',W/2,H/2);g.font='26px sans-serif';g.fillText(paused?'右画面を長押しして再開':'アプリを再起動して再開',W/2,H/2+50);g.textAlign='left'}}
let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
const context=cast.framework.CastReceiverContext.getInstance();context.addCustomMessageListener(NS,event=>{try{const m=typeof event.data==='string'?JSON.parse(event.data):event.data;if(m&&m.type==='input')input(m)}catch(e){lastInput='ERROR '+e.message;console.error(e)}});context.start();
</script></body></html>
