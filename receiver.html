<!doctype html><html><head><meta charset="utf-8"><title>Cast Quest</title><script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#071827}canvas{display:block}</style></head><body><canvas id="game"></canvas><script>
const NS='urn:x-cast:com.example.castquest';
const canvas=document.getElementById('game'),g=canvas.getContext('2d');
let key={left:false,right:false};
let player={x:140,y:0,vx:0,vy:0,w:42,h:58,hp:100,maxHp:100,level:1,xp:0,potions:3,onGround:false,attack:0,inv:0};
let camera=0, won=false, gameOver=false;
const worldW=6200, groundY=640;
const platforms=[{x:0,y:groundY,w:worldW,h:300},{x:520,y:520,w:220,h:24},{x:900,y:450,w:180,h:24},{x:1350,y:540,w:260,h:24},{x:1900,y:470,w:180,h:24},{x:2450,y:400,w:240,h:24},{x:3100,y:530,w:260,h:24},{x:3800,y:450,w:220,h:24},{x:4550,y:520,w:300,h:24},{x:5300,y:420,w:230,h:24}];
let enemies=[]; let gems=[];
function init(){player.x=140;player.y=groundY-player.h;player.vx=player.vy=0;player.hp=player.maxHp;player.level=1;player.xp=0;player.potions=3;camera=0;won=false;gameOver=false;enemies=[];gems=[];for(let i=0;i<12;i++)enemies.push({x:650+i*430,y:groundY-42,w:44,h:42,hp:i===11?5:2,dir:i%2?1:-1,boss:i===11});for(let i=0;i<15;i++)gems.push({x:420+i*360,y:groundY-100-(i%3)*70,taken:false});}
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}addEventListener('resize',resize);resize();init();
function input(a,p){if(a==='left'||a==='right')key[a]=p;if(!p)return;if(a==='jump'&&player.onGround){player.vy=-760;player.onGround=false;}if(a==='attack'&&player.attack<=0)player.attack=.28;if(a==='potion'&&player.potions>0&&player.hp<player.maxHp){player.potions--;player.hp=Math.min(player.maxHp,player.hp+45);}if(a==='reset')init();if(a==='sync'){} }
function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function update(dt){if(gameOver||won)return;player.vx=(key.right?260:0)-(key.left?260:0);player.vy+=1850*dt;let oldY=player.y;player.x+=player.vx*dt;player.y+=player.vy*dt;player.x=Math.max(0,Math.min(worldW-player.w,player.x));player.onGround=false;for(const p of platforms){if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y+8&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true;}}
if(player.y>canvas.height+400){player.hp=0;}if(player.attack>0)player.attack-=dt;if(player.inv>0)player.inv-=dt;
for(const e of enemies){if(e.hp<=0)continue;e.x+=e.dir*(e.boss?65:42)*dt;if(e.x<100||e.x>worldW-100)e.dir*=-1;let hit={x:player.x+(player.vx>=0?player.w:-55),y:player.y+8,w:55,h:40};if(player.attack>0&&rects(hit,e)){e.hp--;player.attack=0;if(e.hp<=0){player.xp+=e.boss?50:12;if(player.xp>=player.level*30){player.level++;player.maxHp+=15;player.hp=player.maxHp;}}}if(rects(player,e)&&player.inv<=0){player.hp-=e.boss?25:14;player.inv=1;player.vy=-320;}}
for(const gem of gems){if(!gem.taken&&Math.abs((player.x+player.w/2)-gem.x)<42&&Math.abs((player.y+player.h/2)-gem.y)<50){gem.taken=true;player.xp+=5;}}
if(player.hp<=0)gameOver=true;if(player.x>worldW-180)won=true;camera+=(Math.max(0,Math.min(worldW-canvas.width,player.x-canvas.width*.35))-camera)*Math.min(1,dt*7);}
function draw(){let W=canvas.width,H=canvas.height;let scale=H/720;g.setTransform(scale,0,0,scale,0,0);W/=scale;H/=scale;g.fillStyle='#6fd3ff';g.fillRect(0,0,W,H);g.fillStyle='#dff6ff';for(let i=0;i<8;i++){let cx=((i*310-camera*.18)%2400+2400)%2400-200;g.beginPath();g.arc(cx,110+(i%3)*55,55,0,7);g.fill();}
g.fillStyle='#75b85b';for(let i=0;i<20;i++){let hx=i*380-camera*.45;g.beginPath();g.moveTo(hx,groundY);g.lineTo(hx+190,300+(i%3)*55);g.lineTo(hx+380,groundY);g.fill();}
g.save();g.translate(-camera,0);for(const p of platforms){g.fillStyle=p.y===groundY?'#654321':'#8b5a2b';g.fillRect(p.x,p.y,p.w,p.h);g.fillStyle='#38a34a';g.fillRect(p.x,p.y,p.w,12);}for(const gem of gems){if(!gem.taken){g.fillStyle='#7c3aed';g.beginPath();g.moveTo(gem.x,gem.y-14);g.lineTo(gem.x+13,gem.y);g.lineTo(gem.x,gem.y+14);g.lineTo(gem.x-13,gem.y);g.fill();}}
for(const e of enemies){if(e.hp<=0)continue;g.fillStyle=e.boss?'#991b1b':'#e11d48';g.fillRect(e.x,e.y,e.w,e.h);g.fillStyle='white';g.fillRect(e.x+8,e.y+10,8,8);g.fillRect(e.x+e.w-16,e.y+10,8,8);}
if(player.inv<=0||Math.floor(player.inv*12)%2===0){g.fillStyle='#f59e0b';g.fillRect(player.x,player.y,player.w,player.h);g.fillStyle='#0f172a';g.fillRect(player.x+8,player.y+11,8,8);g.fillStyle='#2563eb';g.fillRect(player.x+4,player.y+35,player.w-8,20);}if(player.attack>0){g.fillStyle='#fef08a';g.fillRect(player.x+player.w,player.y+12,45,12);}g.fillStyle='#facc15';g.fillRect(worldW-100,groundY-150,18,150);g.fillStyle='#ef4444';g.fillRect(worldW-82,groundY-150,95,55);g.restore();
g.setTransform(scale,0,0,scale,0,0);g.fillStyle='rgba(15,23,42,.86)';g.fillRect(18,18,420,92);g.fillStyle='white';g.font='bold 24px sans-serif';g.fillText('CAST QUEST',34,48);g.font='18px sans-serif';g.fillText(`LV ${player.level}  XP ${player.xp}  POTION ${player.potions}`,34,78);g.fillStyle='#3f1d1d';g.fillRect(210,60,200,18);g.fillStyle='#22c55e';g.fillRect(210,60,200*Math.max(0,player.hp/player.maxHp),18);g.fillStyle='white';g.fillText(`HP ${Math.max(0,player.hp)}/${player.maxHp}`,215,76);if(gameOver||won){g.fillStyle='rgba(0,0,0,.72)';g.fillRect(0,0,W,H);g.fillStyle=won?'#fde047':'#fff';g.font='bold 62px sans-serif';g.textAlign='center';g.fillText(won?'STAGE CLEAR!':'GAME OVER',W/2,H/2);g.font='26px sans-serif';g.fillText('スマホの「最初から」で再開',W/2,H/2+50);g.textAlign='left';}}
let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);}requestAnimationFrame(loop);
const context=cast.framework.CastReceiverContext.getInstance();context.addCustomMessageListener(NS,e=>{try{const m=typeof e.data==='string'?JSON.parse(e.data):e.data;if(m&&m.type==='input')input(m.action,!!m.pressed);}catch(err){console.error(err);}});context.start();
</script></body></html>
