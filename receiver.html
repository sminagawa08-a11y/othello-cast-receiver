<!doctype html><html><head><meta charset="utf-8"><script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script><style>html,body,canvas{margin:0;width:100%;height:100%;background:#10181c;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>
const NS='urn:x-cast:com.example.othello',cv=document.getElementById('c'),g=cv.getContext('2d');let s={board:'000000000000000000000000000WB000000BW0000000000000000000000000',turn:1,black:2,white:2,x:.5,y:.5,over:false};function draw(){cv.width=innerWidth;cv.height=innerHeight;g.fillStyle='#10181c';g.fillRect(0,0,cv.width,cv.height);g.fillStyle='white';g.font='bold 48px sans-serif';g.fillText('OTHELLO',60,70);g.font='30px sans-serif';g.fillText(`Black ${s.black}   White ${s.white}   Turn ${s.turn==1?'Black':'White'}`,60,115);let z=Math.min(cv.width*.72,cv.height*.78),l=(cv.width-z)/2,t=cv.height*.16,d=z/8;g.fillStyle='#1e823c';g.fillRect(l,t,z,z);g.strokeStyle='#083b18';g.lineWidth=4;for(let i=0;i<=8;i++){g.beginPath();g.moveTo(l+i*d,t);g.lineTo(l+i*d,t+z);g.stroke();g.beginPath();g.moveTo(l,t+i*d);g.lineTo(l+z,t+i*d);g.stroke()}for(let r=0;r<8;r++)for(let q=0;q<8;q++){let v=s.board[r*8+q];if(v!='0'){g.beginPath();g.fillStyle=v=='B'?'#050505':'#fff';g.arc(l+q*d+d/2,t+r*d+d/2,d*.38,0,7);g.fill()}}g.strokeStyle='#ffd93d';g.lineWidth=8;g.strokeRect(l+Math.floor(s.x*8)*d+5,t+Math.floor(s.y*8)*d+5,d-10,d-10);if(s.over){g.fillStyle='#ffd93d';g.font='bold 42px sans-serif';g.fillText('GAME OVER',cv.width-330,70)}}addEventListener('resize',draw);draw();const ctx=cast.framework.CastReceiverContext.getInstance();ctx.addCustomMessageListener(NS,e=>{try{s={...s,...JSON.parse(e.data)};draw()}catch(_){}});ctx.start();
</script></body></html>
